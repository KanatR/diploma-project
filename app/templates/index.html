<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud DevOps Task Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .container { max-width: 800px; margin-top: 50px; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">DevSecOps Diploma Project</span>
        </div>
    </nav>

    <div class="container">
        <div class="card p-4">
            <h2 class="mb-3">Project Tasks</h2>
            <form action="/add" method="post" class="input-group mb-3">
                <input type="text" name="task" class="form-control" placeholder="New Task..." required>
                <button class="btn btn-success" type="submit">Add Task</button>
            </form>

            <ul class="list-group">
                {% for t in tasks %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ t.task }}
                    <span class="badge bg-secondary rounded-pill">{{ t.status }}</span>
                </li>
                {% endfor %}
            </ul>
        </div>
    </div>
</body>
</html>

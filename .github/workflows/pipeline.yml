name: Build and Push to AWS ECR

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
# JOB 1: CI (Continuous Integration) - Test & Secure
  test_code:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.9
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"
    
    - name: Install dependencies
      run: |
        pip install fastapi uvicorn jinja2 python-multipart pytest httpx bandit safety

    - name: Security Scan - Bandit (SAST)
      # This scans app/ for common vulnerabilities
      # -ll means "report only Medium and High severity issues"
      run: |
        bandit -r app/ -ll

    - name: Security Scan - Safety (Dependencies)
      # This checks if your installed libraries have known CVEs
      run: |
        safety check

    - name: Run Unit Tests
      run: |
        pytest

  # JOB 2: CD (Continuous Deployment) - Build & Push Image
  build_and_push:
    needs: test_code  # Only run if tests pass
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        # Note: We assume the repo name is diploma-app based on previous steps
        ECR_REPOSITORY: diploma-app
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG